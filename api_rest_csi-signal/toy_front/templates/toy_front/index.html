<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI People Counter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        .navbar { background: #1e293b; color: #38bdf8; padding: 14px 24px; font-size: 20px; font-weight: 600; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .navbar small { font-size: 13px; color: #94a3b8; font-weight: 400; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .card { background: #1e293b; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
        .card-full { grid-column: 1 / -1; }
        .card-header { padding: 14px 20px; border-bottom: 1px solid #334155; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
        .card-body { padding: 20px; }
        .big-number { font-size: 48px; font-weight: 700; text-align: center; padding: 10px 0; }
        .big-number .label { font-size: 14px; color: #94a3b8; font-weight: 400; display: block; margin-top: 4px; }
        .big-number.ocupado { color: #f97316; }
        .big-number.vacio { color: #22c55e; }
        .big-number.medio { color: #eab308; }
        .big-number.alto { color: #ef4444; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .stat-row .stat-label { color: #94a3b8; }
        .stat-row .stat-value { font-weight: 600; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge.ok { background: #166534; color: #86efac; }
        .badge.warn { background: #854d0e; color: #fde047; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; border-bottom: 1px solid #334155; }
        td { padding: 10px 12px; border-bottom: 1px solid #1e293b; }
        .rssi-bar { height: 4px; background: #334155; border-radius: 2px; overflow: hidden; }
        .rssi-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); border-radius: 2px; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin .8s linear infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }
    </style>
</head>
<body>
    <div class="navbar">
        CSI People Counter
        <small><span class="status-dot online" id="statusDot"></span><span id="statusText">Conectado</span></small>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">Estado Actual</div>
            <div class="card-body">
                <div class="big-number vacio" id="estadoActual">--</div>
                <div style="text-align:center;font-size:13px;color:#94a3b8;" id="detalleEstado">Esperando datos...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Señal</div>
            <div class="card-body">
                <div class="stat-row"><span class="stat-label">RSSI</span><span class="stat-value" id="rssiVal">--</span></div>
                <div class="rssi-bar"><div class="rssi-bar-fill" id="rssiBar" style="width:0%"></div></div>
                <div class="stat-row" style="margin-top:12px"><span class="stat-label">Confianza</span><span class="stat-value" id="confianzaVal">--</span></div>
                <div class="stat-row"><span class="stat-label">Modelo</span><span class="stat-value">RF 3 clases</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Últimas Lecturas</div>
            <div class="card-body">
                <div class="stat-row"><span class="stat-label">Total registros</span><span class="stat-value" id="totalRegs">0</span></div>
                <div class="stat-row"><span class="stat-label">Vacío</span><span class="stat-value" id="countVacio">0</span></div>
                <div class="stat-row"><span class="stat-label">Ocupado</span><span class="stat-value" id="countOcupado">0</span></div>
            </div>
        </div>

        <div class="card card-full">
            <div class="card-header">Historial de Predicciones</div>
            <div class="card-body" style="padding:0">
                <div id="historialBody" class="empty-state">
                    <div class="icon">📡</div>
                    <div>Esperando datos del ESP32...</div>
                    <div style="margin-top:8px;font-size:12px;">Envía una petición POST a <code>/recognize/api/</code> con datos CSI</div>
                </div>
                <table id="historialTable" style="display:none">
                    <thead><tr><th>Hora</th><th>RSSI</th><th>Predicción</th><th>Confianza</th></tr></thead>
                    <tbody id="historialBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let lastData = null;

        async function fetchHistorial() {
            try {
                const res = await fetch('/api/historial/');
                if (!res.ok) return;
                const data = await res.json();
                renderHistorial(data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderHistorial(data) {
            const table = document.getElementById('historialTable');
            const empty = document.querySelector('.empty-state');
            const tbody = document.getElementById('historialBody');

            if (!data || data.length === 0) {
                table.style.display = 'none';
                if (empty) empty.style.display = '';
                return;
            }

            table.style.display = '';
            if (empty) empty.style.display = 'none';

            const last = data[0];
            lastData = last;
            updateDashboard(last);

            const labels = {0:'Vacío', 1:'1-3 pers', 2:'4-7 pers'};
            const classes = {0:'vacio', 1:'medio', 2:'alto'};
            const total = data.length;
            const nVacio = data.filter(d => d.pred === 0).length;
            const nOcupado = total - nVacio;

            document.getElementById('totalRegs').textContent = total;
            document.getElementById('countVacio').textContent = nVacio;
            document.getElementById('countOcupado').textContent = nOcupado;

            tbody.innerHTML = data.map(d => {
                const ts = new Date(d.ts).toLocaleTimeString();
                const label = labels[d.pred] || d.pred;
                const cls = classes[d.pred] || '';
                const conf = (d.conf * 100).toFixed(0) + '%';
                const rssiNorm = Math.max(0, Math.min(100, ((d.rssi + 100) / 50) * 100));
                return `<tr>
                    <td>${ts}</td>
                    <td>${d.rssi} dBm <div class="rssi-bar" style="margin-top:4px"><div class="rssi-bar-fill" style="width:${rssiNorm}%"></div></div></td>
                    <td><span class="badge ${cls}">${label}</span></td>
                    <td>${conf}</td>
                </tr>`;
            }).join('');
        }

        function updateDashboard(last) {
            const isVacio = last.pred === 0;
            const el = document.getElementById('estadoActual');
            const detalle = document.getElementById('detalleEstado');
            const labels = {0:'Vacío', 1:'1-3 personas', 2:'4-7 personas'};
            const cls = {0: 'vacio', 1: 'medio', 2: 'alto'};

            const label = labels[last.pred] || 'Desconocido';
            el.textContent = label;
            el.className = 'big-number ' + (cls[last.pred] || '');

            detalle.textContent = isVacio
                ? 'No se detectan personas en la habitación'
                : `Se detectan aproximadamente ${last.pred < 2 ? '1-3' : '4-7'} personas`;

            document.getElementById('rssiVal').textContent = last.rssi + ' dBm';
            const rssiPct = Math.max(0, Math.min(100, ((last.rssi + 100) / 50) * 100));
            document.getElementById('rssiBar').style.width = rssiPct + '%';
            document.getElementById('confianzaVal').textContent = (last.conf * 100).toFixed(1) + '%';
        }

        setInterval(fetchHistorial, 3000);
        fetchHistorial();
    </script>
</body>
</html>
