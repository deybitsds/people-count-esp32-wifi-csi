<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI People Counter</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            padding: 0 24px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }
        .nav-title { font-size: 14px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.01em; }
        .nav-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #86868b; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #c7c7cc; }
        .status-dot.online { background: #30d158; }

        .layout { max-width: 1120px; margin: 0 auto; padding: 24px 20px; display: grid; grid-template-columns: 1fr; gap: 12px; }

        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 1px 2px -1px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #86868b;
        }
        .card-body { padding: 16px; }

        .hero {
            text-align: center;
            padding: 32px 16px;
        }
        .hero-number {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .hero-number.vacio { color: #1d1d1f; }
        .hero-number.medio { color: #b8860b; }
        .hero-number.alto { color: #dc2626; }
        .hero-detail {
            margin-top: 8px;
            font-size: 13px;
            color: #86868b;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        .stat-row + .stat-row { border-top: 1px solid #f0f0f0; }
        .stat-label { color: #86868b; }
        .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; color: #1d1d1f; }

        .rssi-bar {
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin: 4px 0 0;
        }
        .rssi-bar-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #30d158, #ffd60a, #ff453a);
            transition: width 0.4s ease;
        }

        .table-wrap { padding: 0; }
        .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table-wrap th {
            text-align: left;
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #86868b;
            border-bottom: 1px solid #e5e5e5;
        }
        .table-wrap td {
            padding: 10px 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .table-wrap tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.vacio { background: #f0f0f0; color: #1d1d1f; }
        .badge.medio { background: #fff3cd; color: #856404; }
        .badge.alto { background: #fde8e8; color: #c53030; }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: #aeaeb2;
        }
        .empty-state p + p { margin-top: 6px; font-size: 12px; }
        .empty-state code { color: #86868b; background: #f5f5f7; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

        .spinner {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid #e5e5e5;
            border-top-color: #1d1d1f;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (min-width: 720px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <span class="nav-title">CSI People Counter</span>
        <span class="nav-status">
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">Conectado</span>
        </span>
    </div>

    <div class="layout">

        <div class="card">
            <div class="card-header">Estado Actual</div>
            <div class="card-body hero">
                <div class="hero-number vacio" id="estadoActual">--</div>
                <div class="hero-detail" id="detalleEstado">Esperando datos...</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="card">
                <div class="card-header">Señal</div>
                <div class="card-body">
                    <div class="stat-row">
                        <span class="stat-label">RSSI</span>
                        <span class="stat-value" id="rssiVal">--</span>
                    </div>
                    <div class="rssi-bar"><div class="rssi-bar-fill" id="rssiBar" style="width:0%"></div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Resumen</div>
                <div class="card-body">
                    <div class="stat-row">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="totalRegs">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Vacío</span>
                        <span class="stat-value" id="countVacio">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Con personas</span>
                        <span class="stat-value" id="countOcupado">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Historial de Predicciones</div>
            <div class="card-body table-wrap">
                <div id="historialEmpty" class="empty-state">
                    <div style="margin-bottom:8px;font-size:24px;">📡</div>
                    <p>Esperando datos del ESP32...</p>
                    <p>Envía una petición POST a <code>/recognize/api/</code> con datos CSI</p>
                </div>
                <table id="historialTable" style="display:none">
                    <thead>
                        <tr><th>Hora</th><th>RSSI</th><th>Personas</th></tr>
                    </thead>
                    <tbody id="historialBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function fetchHistorial() {
            try {
                const res = await fetch('/api/historial/');
                if (!res.ok) return;
                renderHistorial(await res.json());
            } catch (e) { console.error(e); }
        }

        function renderHistorial(data) {
            const table = document.getElementById('historialTable');
            const empty = document.getElementById('historialEmpty');
            const tbody = document.getElementById('historialBody');

            if (!data || data.length === 0) {
                table.style.display = 'none';
                if (empty) empty.style.display = '';
                return;
            }

            table.style.display = '';
            if (empty) empty.style.display = 'none';

            const last = data[0];
            updateDashboard(last);

            document.getElementById('totalRegs').textContent = data.length;
            document.getElementById('countVacio').textContent = data.filter(d => d.pred === 0).length;
            document.getElementById('countOcupado').textContent = data.filter(d => d.pred !== 0).length;

            tbody.innerHTML = data.map(d => {
                const ts = new Date(d.ts).toLocaleTimeString();
                const label = personaLabel(d.pred);
                const cls = personaClass(d.pred);
                const rssiNorm = Math.max(0, Math.min(100, ((d.rssi + 100) / 50) * 100));
                return `<tr>
                    <td style="color:#86868b;">${ts}</td>
                    <td>${d.rssi} dBm <div class="rssi-bar"><div class="rssi-bar-fill" style="width:${rssiNorm}%"></div></div></td>
                    <td><span class="badge ${cls}">${label}</span></td>
                </tr>`;
            }).join('');
        }

        function personaLabel(n) {
            if (n === 0) return 'Vacío';
            if (n === 1) return '1 persona';
            return `${n} personas`;
        }

        function personaClass(n) {
            if (n === 0) return 'vacio';
            if (n <= 3) return 'medio';
            return 'alto';
        }

        function updateDashboard(last) {
            const el = document.getElementById('estadoActual');
            const detalle = document.getElementById('detalleEstado');
            const label = personaLabel(last.pred);
            const cls = personaClass(last.pred);

            el.textContent = label;
            el.className = 'hero-number ' + cls;

            detalle.textContent = last.pred === 0
                ? 'No se detectan personas en la habitación'
                : `Se detectan exactamente ${last.pred} ${last.pred === 1 ? 'persona' : 'personas'}`;

            document.getElementById('rssiVal').textContent = last.rssi + ' dBm';
            const rssiPct = Math.max(0, Math.min(100, ((last.rssi + 100) / 50) * 100));
            document.getElementById('rssiBar').style.width = rssiPct + '%';
        }

        setInterval(fetchHistorial, 3000);
        fetchHistorial();
    </script>
</body>
</html>
